# Foundry config — invariant/fuzz suite for the ProYield money path.
# Tests live in test/forge/*.t.sol. The hardhat battery (scripts/run_battery.sh)
# remains the integration layer; this suite adds stateful property fuzzing
# (handlers + invariants) that a script-based suite cannot explore.
#
# NOTE: optimizer is ON here (and, since 2026-09-24, ON for the hardhat build
# too — the unoptimized vault runtime (15,304B) exceeded HyperEVM's 3,000,000
# gas per-tx cap at code-deposit cost alone (200 gas/byte), making the deploy
# impossible; optimized runtime is 9,248B, deploy ≈ 2.20M gas. Both toolchains
# now build the same semantics; foundry was already optimized.
[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 64
depth = 200
fail_on_revert = false

[fuzz]
runs = 64
